<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lany Books - Mobile Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#c0c7ce",
                        "tertiary-container": "#7a9a81",
                        "on-error-container": "#93000a",
                        "primary-container": "#6499b9",

                        "on-tertiary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "on-secondary-fixed": "#1e1c07",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "on-primary-fixed": "#001e2d",
                        "secondary": "#635f44",
                        "outline": "#71787e",
                        "surface-container-highest": "#e5e2e1",
                        "on-primary-fixed-variant": "#074c69",
                        "primary-fixed": "#c5e7ff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-surface": "#1c1b1b",
                        "primary": "#2c6482",
                        "on-tertiary-container": "#14311e",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eded",
                        "secondary-fixed-dim": "#cdc7a6",
                        "inverse-primary": "#98cdef",
                        "surface-container-low": "#f6f3f2",
                        "on-primary-container": "#002f43",
                        "surface-dim": "#dcd9d9",
                        "background": "#fcf9f8",
                        "surface-bright": "#fcf9f8",
                        "surface-tint": "#2c6482",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary-fixed": "#03210f",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#676348",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#eae3c1",
                        "secondary-container": "#e7e0be",
                        "primary-fixed-dim": "#98cdef",
                        "on-tertiary-fixed-variant": "#304d38",
                        "tertiary-fixed-dim": "#adcfb3",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#41484d",
                        "on-secondary-fixed-variant": "#4b472e",
                        "surface": "#fcf9f8",
                        "on-error": "#ffffff",
                        "inverse-surface": "#313030",
                        "tertiary": "#47654f"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "8px",
                        "container-max-width": "1200px",
                        "section-padding-v": "80px",
                        "gutter": "24px",
                        "margin-mobile": "20px"
                    },
                    fontFamily: {
                        "display-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "button": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "button": ["15px", { "lineHeight": "1", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .menu-enter {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .nav-item-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased overflow-hidden">
<!-- Mobile Menu Overlay -->
<div class="fixed inset-0 z-[100] bg-surface flex flex-col menu-enter">
<!-- Top App Bar (Modified for Menu) -->
<header class="flex flex-col flex-none px-margin-mobile pt-6 pb-4 bg-background sticky top-0 z-50">
<div class="flex items-center justify-between h-16 w-full">
<!-- Brand Anchor -->
<div class="flex items-center gap-3">
<img alt="Lany Books Logo" class="w-10 h-10 object-cover rounded-lg shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLue682uHxaqjie2KxD6ena2Vbcy2YfVXiT0NAbScOSOI4K4hoCkSMMdG8ZM1y4Bc5m39gheZggWIaGmA8lMz1naeR9V7IZ2dqd1l6_vab3YlIX_7i7zFwJ6WVyMzi9NIN0xz13-EGUY-oIc1BD6VguCaF57qwrI32S00e1xLqFTJQlkUWZ-FH-HeG5RWjTSl7aDyL_Q7dwywxYULOn4gqXua0mhm_j2UHBit5u6rXRiwFKezc1f_5yCtCQ"/>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">Lany Books</span>
</div>
<!-- Close Action -->
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface transition-colors cursor-pointer active:scale-95" onclick="window.location.href='{{DATA:SCREEN:SCREEN_20}}'">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</header>
<!-- Main Menu Content Area -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-8 flex flex-col gap-12 relative z-10">
<!-- Navigation Links -->
<nav aria-label="Main Navigation" class="flex flex-col gap-6">
<a class="nav-item-enter font-headline-md text-headline-md text-on-surface hover:text-primary transition-colors flex items-center justify-between group" href="#" style="animation-delay: 0.1s;">
                    The Method
                    <span class="material-symbols-outlined text-outline opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</a>
<a class="nav-item-enter font-headline-md text-headline-md text-on-surface hover:text-primary transition-colors flex items-center justify-between group" href="#" style="animation-delay: 0.15s;">
                    Digital Platform
                    <span class="material-symbols-outlined text-outline opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</a>
<a class="nav-item-enter font-headline-md text-headline-md text-on-surface hover:text-primary transition-colors flex items-center justify-between group" href="#" style="animation-delay: 0.2s;">
                    Gallery
                    <span class="material-symbols-outlined text-outline opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</a>
<a class="nav-item-enter font-headline-md text-headline-md text-on-surface hover:text-primary transition-colors flex items-center justify-between group" href="#" style="animation-delay: 0.25s;">
                    About
                    <span class="material-symbols-outlined text-outline opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</a>
</nav>
<!-- Divider -->
<div class="h-px bg-surface-container-high w-full"></div>
<!-- Settings / Preferences -->
<div class="flex flex-col gap-8 nav-item-enter" style="animation-delay: 0.3s;">
<!-- Language Switcher -->
<div class="flex flex-col gap-4">
<span class="font-label-md text-label-md text-outline uppercase tracking-wider">Language</span>
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-xl border border-surface-container-high">
<button class="flex-1 py-3 px-4 rounded-lg bg-surface text-on-surface shadow-sm font-button text-button flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">language</span>
                            English
                        </button>
<button class="flex-1 py-3 px-4 rounded-lg text-on-surface-variant hover:bg-surface-variant font-button text-button transition-all">
                            Español
                        </button>
</div>
</div>
<!-- Theme Toggle -->
<div class="flex flex-col gap-4">
<span class="font-label-md text-label-md text-outline uppercase tracking-wider">Appearance</span>
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-xl border border-surface-container-high">
<button class="flex-1 py-3 px-4 rounded-lg bg-surface text-on-surface shadow-sm font-button text-button flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">light_mode</span>
                            Light
                        </button>
<button class="flex-1 py-3 px-4 rounded-lg text-on-surface-variant hover:bg-surface-variant font-button text-button flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">dark_mode</span>
                            Dark
                        </button>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="flex-none p-margin-mobile bg-background border-t border-surface-container-highest nav-item-enter" style="animation-delay: 0.4s;">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded-full shadow-sm hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
                Join Waitlist
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<!-- Decorative Background Wash -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] right-[-20%] w-[120%] h-[50%] bg-primary-fixed opacity-30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-20%] left-[-20%] w-[80%] h-[60%] bg-tertiary-fixed opacity-30 rounded-full blur-[120px]"></div>
</div>
</div>
</body></html>
