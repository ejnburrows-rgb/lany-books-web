<style>

        .btn-press:active {

        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: gentleFloat 6s ease-in-out infinite;

            50% { opacity: 1; transform: scale(1.2); }
