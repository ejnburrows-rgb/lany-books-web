<style>
        .ink-border {
            border: 2px solid theme('colors.outline');
        }
        .squishy-button {
            border-bottom-width: 4px;
            border-bottom-color: theme('colors.on-primary-fixed-variant');
            transition: all 0.1s ease-in-out;
        }
        .squishy-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-top: 2px;
        }
        
        .speech-bubble {
            position: relative;
            background: theme('colors.surface-container-lowest');
            border-radius: theme('borderRadius.xl');
            border: 2px solid theme('colors.outline');
            padding: 1.5rem;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: theme('colors.outline') transparent transparent transparent;
            display: block;
            width: 0;
        }
        
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 13px 13px 0;
            border-style: solid;
            border-color: theme('colors.surface-container-lowest') transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }
    </style>
