<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gretel Avatar Sheet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f2ede8",
                        "on-background": "#1d1b19",
                        "surface-dim": "#ded9d4",
                        "primary-fixed-dim": "#ffb4ab",
                        "surface-container-highest": "#e6e2dd",
                        "secondary-fixed": "#ffdcbe",
                        "on-secondary-fixed": "#2d1600",
                        "on-tertiary-fixed-variant": "#004883",
                        "on-primary-fixed": "#410002",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#8c1815",
                        "secondary-container": "#feb873",
                        "primary": "#aa2e28",
                        "on-surface-variant": "#59413e",
                        "outline-variant": "#e0bfbb",
                        "on-surface": "#1d1b19",
                        "on-secondary": "#ffffff",
                        "secondary": "#875216",
                        "on-tertiary-fixed": "#001c39",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e6e2dd",

                        "error-container": "#ffdad6",

                        "tertiary-fixed-dim": "#a4c9ff",
                        "inverse-primary": "#ffb4ab",
                        "outline": "#8c716d",

                        "inverse-on-surface": "#f5f0eb",
                        "tertiary-fixed": "#d4e3ff",

                        "tertiary": "#005da7"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    "spacing": {
                        "margin-page": "2rem",
                        "section-padding": "3rem",
                        "card-gap": "1rem",
                        "touch-target-min": "3.5rem",
                        "gutter": "1.5rem"
                    },
                    "fontFamily": {
                        "display-hero": ["Plus Jakarta Sans"],
                        "alphabet-card": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-reading-mobile": ["Plus Jakarta Sans"],
                        "body-reading": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-hero": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "alphabet-card": ["64px", { "lineHeight": "72px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-reading-mobile": ["20px", { "lineHeight": "30px", "fontWeight": "500" }],
                        "body-reading": ["24px", { "lineHeight": "36px", "fontWeight": "500" }],
                        "label-bold": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .ink-border {
            border: 2px solid theme('colors.outline');
        }
        .squishy-button {
            border-bottom: 4px solid theme('colors.on-primary-fixed-variant');
            transition: transform 0.1s, border-width 0.1s;
        }
        .squishy-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-background dark:bg-surface-container docked full-width top-0 border-b-2 border-outline-variant dark:border-outline flat no shadows flex justify-between items-center w-full px-margin-page h-touch-target-min z-10 sticky">
<button aria-label="Home" class="flex items-center justify-center w-12 h-12 rounded-full hover:opacity-90 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-size: 28px;">home</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-primary-fixed-dim text-center flex-1">
            Gretel Avatar Sheet
        </h1>
<button aria-label="Audio" class="flex items-center justify-center w-12 h-12 rounded-full hover:opacity-90 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-size: 28px;">volume_up</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-margin-page py-section-padding">
<div class="text-center mb-12">
<h2 class="font-display-hero text-display-hero text-primary mb-4">Conoce a Gretel</h2>
<p class="font-body-reading-mobile text-body-reading-mobile md:font-body-reading md:text-body-reading text-on-surface-variant max-w-2xl mx-auto">
                Aquí tienes tres poses de Gretel, listas para acompañarte en tu aventura de aprendizaje.
            </p>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-gutter items-end justify-center">
<!-- Pose A: Standing/Idle -->
<div class="flex flex-col items-center group">
<div class="relative w-64 h-96 md:w-80 md:h-[30rem] bg-surface-container rounded-3xl ink-border overflow-hidden flex items-end justify-center p-4 transition-transform duration-300 group-hover:-translate-y-2 group-hover:shadow-lg">
<!-- Subtle background decoration -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-bright/50 to-transparent"></div>
<img alt="Gretel standing idle" class="relative z-10 h-full object-contain object-bottom drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1UBecH30SIyNRKwAsciPdOl2Zt1qVc4mXTuBAD2R8ESlkxEd6RBEZAXC2x1R3mksKog-VOkuV1IPG8aAG9CgnnOk2BaJoU_KrgwYdNe2H3-BqjdKj9EICdiCHBNhgsyKUdyFBOgCZ6mkfsDI6-viZd1OEu2pObNMJo2P9wol7fiwxnQtr6a5ohuuCTNXSzAg5T-lZ2aPOBzykCAtDWHQtbztGP5djgGMHlwTjytHJb8ixGDeqV8xC7nURN0PRdQ0WAup1x3vc6jQ"/>
</div>
<div class="mt-6 bg-surface-container-low px-6 py-3 rounded-full ink-border">
<span class="font-label-bold text-label-bold text-on-surface">Lista para aprender</span>
</div>
</div>
<!-- Pose B: Pointing/Encouraging -->
<div class="flex flex-col items-center group">
<div class="relative w-64 h-96 md:w-80 md:h-[30rem] bg-secondary-container rounded-3xl ink-border overflow-hidden flex items-end justify-center p-4 transition-transform duration-300 group-hover:-translate-y-2 group-hover:shadow-lg">
<!-- Subtle background decoration -->
<div class="absolute top-4 left-4 text-white/30">
<span class="material-symbols-outlined" style="font-size: 48px;">star</span>
</div>
<img alt="Gretel pointing and encouraging" class="relative z-10 h-full object-contain object-bottom drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCN1RqVNpdGv6cqDgyjKVRcCXhoHTTEiTfQtlF9D7HA9kSl6vH6hNWY8WZGAvm-kc0GCr9Yu7TVKRq_2Ox-Kyib_efHXqh7c9OoKynSzs6e6EW32iJ5M2Y3TuAvHHDaAeXt1dAeJGeAbYAQKLTWOqGt0BqZX-CtKbFFyta6pEap06QZioIwgv6cfWGQMBakty_2REt1TszUhZNerja1T6An3zXjKEBRqQITTkO9CKEjWLG-r-5ekFzWDBsrUZpmGZmtt9QffSNQ1A"/>
</div>
<div class="mt-6 bg-secondary-container px-6 py-3 rounded-full ink-border">
<span class="font-label-bold text-label-bold text-on-secondary-container">¡Mira esto!</span>
</div>
</div>
<!-- Pose C: Cheering with arms up -->
<div class="flex flex-col items-center group">
<div class="relative w-64 h-96 md:w-80 md:h-[30rem] bg-tertiary-container rounded-3xl ink-border overflow-hidden flex items-end justify-center p-4 transition-transform duration-300 group-hover:-translate-y-2 group-hover:shadow-lg">
<!-- Subtle background decoration -->
<div class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-white/20 to-transparent"></div>
<img alt="Gretel cheering with arms up" class="relative z-10 h-full object-contain object-bottom drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9cGwZT8H8jNECpn2kkq6K0OErdrFyhfQm-judWxKs9F94WEdUvS1CLv8ZOuQ3--pMe23x96Lq9heHtrXKkMYOlCxwC2O53dxGbQHLihQcrVlXj9vCraT76yEnU-Zrx1WpEmYWJx3oGxzqkJLFUyZPaxNRObQPT0-Q-zqNrb0k9OSWWZuYYTQkF006n5GLrlShH00IXg_kNIHHCxsXCSL_Pv4NBSCmpCQ-xwUbVkVwF0G2Aa9nKLPfje_ABh3PpknMuTmophBQ61U"/>
</div>
<div class="mt-6 bg-tertiary-container px-6 py-3 rounded-full ink-border">
<span class="font-label-bold text-label-bold text-on-tertiary-container">¡Lo lograste!</span>
</div>
</div>
</div>
</main>
</body></html>
